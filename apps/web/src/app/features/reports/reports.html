<app-page-header
  title="Reportes y analítica"
  subtitle="Indicadores, tendencias y resúmenes del mantenimiento"
  [breadcrumbs]="[{ label: 'Inicio', link: '/app/dashboard' }, { label: 'Reportes' }]"
>
  <div actions class="flex items-center gap-2">
    <hlm-select [itemToString]="itemToString">
      <hlm-select-trigger class="w-48">
        <hlm-select-value placeholder="Rango de fechas" />
      </hlm-select-trigger>
      <hlm-select-content *hlmSelectPortal>
        <hlm-select-group>
          @for (opt of dateRangeOptions; track opt.value) {
            <hlm-select-item [value]="opt.value">{{ opt.label }}</hlm-select-item>
          }
        </hlm-select-group>
      </hlm-select-content>
    </hlm-select>
    <button hlmBtn variant="outline" size="sm" (click)="exportar()">
      <ng-icon [name]="lucideDownload" class="mr-1.5 size-4" />
      Exportar
    </button>
  </div>
</app-page-header>

<section class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-5">
  <app-stat-card
    label="MTTR promedio"
    [value]="mttrHours() + ' h'"
    hint="Tiempo medio de reparación"
    trend="up"
    delta="4%"
    icon="lucideClock"
  />
  <app-stat-card
    label="MTBF promedio"
    [value]="mtbfDays() + ' d'"
    hint="Tiempo medio entre fallas"
    trend="up"
    delta="8%"
    icon="lucideBarChart3"
  />
  <app-stat-card
    label="Cumplimiento preventivo"
    [value]="cumplimientoPreventivo() + '%'"
    hint="Planes a tiempo"
    trend="up"
    delta="5%"
    icon="lucideLineChart"
  />
  <app-stat-card
    label="Costo total"
    [value]="formatCurrency(costoTotal())"
    hint="Estimado acumulado"
    trend="down"
    delta="3%"
    icon="lucideUsers"
  />
  <app-stat-card
    label="OT cerradas"
    [value]="otCerradas()"
    [hint]="'de ' + totalOt + ' totales'"
    trend="up"
    delta="12%"
    icon="lucideChartPie"
  />
</section>

<div class="mt-6 grid gap-6 lg:grid-cols-2">
  <app-section-card title="Tendencia de OT" description="Órdenes creadas vs cerradas por mes">
    <app-line-chart body [data]="tendenciaData()" [height]="240" ariaLabel="Tendencia de órdenes de trabajo por mes" />
  </app-section-card>

  <app-section-card title="Costo de mantenimiento" description="Costo estimado mensual">
    <app-bar-chart body [data]="costoPorMesData()" [height]="240" ariaLabel="Costo de mantenimiento por mes" />
  </app-section-card>

  <app-section-card title="OT por tipo" description="Distribución de órdenes por categoría">
    <div body class="flex justify-center">
      <app-donut-chart [data]="otPorTipoData()" [size]="200" ariaLabel="Distribución de OT por tipo" />
    </div>
  </app-section-card>

  <app-section-card title="OT por técnico" description="Top 5 técnicos con más órdenes asignadas">
    <app-bar-chart body [data]="otPorTecnicoData()" [height]="240" ariaLabel="Órdenes por técnico" />
  </app-section-card>
</div>

<app-section-card title="Resumen por activo" description="Conteo de OT, costo y disponibilidad por activo" class="mt-6">
  <app-data-table
    body
    [columns]="assetTableColumns"
    [rows]="assetTableRows()"
    [searchable]="true"
    searchPlaceholder="Buscar activo..."
    [pageSize]="8"
  />
</app-section-card>
